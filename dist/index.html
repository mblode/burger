    <meta charset="utf-8" />

    <base href="/burger/" />
    <meta
      name="description"
      content="Burger is a minimal hamburger menu with fullscreen navigation. No framework, no dependencies: just CSS and a few lines of JavaScript."
    />

    <title>Burger: a minimal hamburger menu</title>
    <link rel="canonical" href="https://blode.co/burger" />
    <meta property="og:title" content="Burger: a minimal hamburger menu" />
    <meta
      property="og:description"
      content="Burger is a minimal hamburger menu with fullscreen navigation. No framework, no dependencies: just CSS and a few lines of JavaScript."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blode.co/burger" />
    <!-- Every blode.co path shares one site name. The product is already in
         og:title, so this slot says who made it. -->
    <meta property="og:site_name" content="Matthew Blode" />
    <meta
      property="og:image"
      content="https://blode.co/burger/img/opengraph-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Burger: a minimal hamburger menu with fullscreen navigation"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mattblode" />
    <meta name="twitter:creator" content="@mattblode" />
    <meta name="author" content="Matthew Blode" />
    <!-- The Next apps emit this from the `creator` metadata field; this page is
         hand-written, so it carries the tag directly. -->
    <meta name="creator" content="Matthew Blode" />
    <!--
      One script, one @graph. Identity is referenced by @id only: blode.co owns
      the bodies of #person, #website and #organization, and minting a second
      one here would publish a second human on the same domain.

      Bare WebPage, not SoftwareApplication: a software rich result also needs
      offers plus a rating, and Google's guidelines forbid the author writing
      their own. See blode-co/apps/web/.claude/knowledge/zone-conventions.md.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebPage",
            "@id": "https://blode.co/burger/#webpage",
            "url": "https://blode.co/burger",
            "name": "Burger",
            "description": "A minimal hamburger menu with fullscreen navigation. One stylesheet, one ES module, no dependencies.",
            "inLanguage": "en",
            "isPartOf": { "@id": "https://blode.co/#website" },
            "breadcrumb": { "@id": "https://blode.co/burger/#breadcrumb" },
            "author": { "@id": "https://blode.co/#person" },
            "publisher": { "@id": "https://blode.co/#organization" }
          },
          {
            "@type": "BreadcrumbList",
            "@id": "https://blode.co/burger/#breadcrumb",
            "itemListElement": [
              {
                "@type": "ListItem",
                "position": 1,
                "name": "Matthew Blode",
                "item": "https://blode.co/"
              },
              {
                "@type": "ListItem",
                "position": 2,
                "name": "Projects",
                "item": "https://blode.co/projects"
              },
              {
                "@type": "ListItem",
                "position": 3,
                "name": "Burger",
                "item": "https://blode.co/burger"
              }
            ]
          }
        ]
      }
    </script>
    <link rel="icon" href="img/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="img/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />

    <style>
      /*
       * Glide 2.0.0 (https://github.com/mblode/glide), on this demo page only.
       * Deliberately not in src/burger.css: the published stylesheet is
       * installed into other people's sites, and bundling a webfont would push
       * 200KB and a typeface nobody asked for onto every one of them.
       *
       * Relative URLs because <base href="/burger/"> is set above, the same way
       * the stylesheet and images are linked.
       */
      @font-face {
        font-family: "Glide";
        src: url("fonts/glide-variable.woff2") format("woff2-variations");
        font-weight: 100 950;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Glide";
        src: url("fonts/glide-variable-italic.woff2") format("woff2-variations");
        font-weight: 100 950;
        font-style: italic;
        font-display: swap;
      }

      @font-face {
        font-family: "Glide Mono";
        src: url("fonts/glide-mono.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      /*
       * Retheming through the token rather than by out-specifying selectors,
       * which is how a consumer is meant to restyle Burger. It reaches the menu
       * and the nav as well as the page copy, so the demo is also a working
       * demonstration of the theming API.
       */
      :root {
        --burger-font-family:
          "Glide", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      /* The brand doubles as this page's heading, so keep the h1 out of the
       inline flow that positions it beside the menu. */
      .b-heading {
        display: inline;
        font-size: inherit;
        margin: 0;
      }

      /*
       * The menu is the page, so there is one line of copy and the credit sits
       * at the foot of the window rather than partway up it. The toggle, the nav
       * and the wash are all `position: fixed` and therefore out of flow, which
       * leaves <main> and <footer> as the only two items in this column.
       */
      body {
        display: flex;
        flex-direction: column;
        margin: 0;
        min-block-size: 100dvh;
      }

      /*
       * `align-content` centres the line in whatever space the footer leaves,
       * with no wrapper element to do it. The block-start padding still clears
       * the pinned toggle via the same token the nav uses, so on a viewport too
       * short to centre anything the copy lands below the button rather than
       * under it.
       */
      .b-content {
        align-content: center;
        color: #1a1a1a;
        flex: 1;
        font-family: var(--burger-font-family);
        font-size: 17px;
        line-height: 1.6;
        margin-inline: auto;
        max-inline-size: 46ch;
        padding-block: var(--burger-nav-offset-block) 30px;
        padding-inline: 30px;
        text-align: center;
        text-wrap: pretty;
      }

      /* The only site-level credit block, so it carries the contentinfo
         landmark this page had none of. */
      .b-footer {
        align-items: center;
        /* A muted colour rather than `opacity`, which would fade the avatar
           along with the text it sits next to. */
        color: #525252;
        display: flex;
        flex-direction: column;
        font-family: var(--burger-font-family);
        font-size: 15px;
        padding-block-end: 30px;
        padding-inline: 30px;
        text-align: center;
      }

      .b-content p,
      .b-footer p {
        margin: 0;
      }

      /*
       * The trail back to the hub. blode.co/burger is blode.co behind a
       * rewrite, so these are internal links: same tab, no rel. The text has to
       * match the BreadcrumbList in <head> word for word, because Google reads
       * a mismatch between the two as a markup error.
       */
      .b-trail {
        font-size: 13px;
        margin-block-end: 20px;
      }

      .b-trail ol {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .b-trail a {
        color: #525252;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .b-trail [aria-current="page"] {
        color: #1a1a1a;
      }

      .b-trail .b-sep {
        user-select: none;
      }

      @media (hover: hover) and (pointer: fine) {
        .b-trail a:hover {
          color: #1a1a1a;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .b-trail a {
          transition: color var(--burger-hover-duration) var(--burger-easing);
        }
      }

      .b-credit,
      .b-elsewhere {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }

      .b-credit {
        gap: 4px;
      }

      .b-elsewhere {
        gap: 12px;
      }

      /*
       * 44px, the same WCAG 2.5.5 floor `--burger-target-size` sets for the
       * menu. As bare inline boxes these were the height of their text.
       */
      .b-footer a {
        align-items: center;
        color: inherit;
        display: inline-flex;
        gap: 8px;
        min-block-size: var(--burger-target-size);
        text-decoration: none;
      }

      .b-author {
        border-radius: 999px;
        padding-inline: 6px 10px;
      }

      .b-avatar {
        border-radius: 50%;
        outline: 1px solid rgb(0 0 0 / 0.05);
        outline-offset: -1px;
      }

      .b-sep {
        color: #c9c9c9;
      }

      .b-footer a:focus-visible {
        outline: 2px solid var(--burger-ring-on-surface);
        outline-offset: 2px;
      }

      /* Gated, or a tap leaves the link stuck in its hover state until you tap
         somewhere else. */
      @media (hover: hover) and (pointer: fine) {
        .b-footer a:hover {
          color: #1a1a1a;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .b-footer a {
          transition: color var(--burger-hover-duration) var(--burger-easing);
        }
      }

      /* The separators are carried by colour alone, so they vanish into the
         forced background unless they are mapped to a system colour. */
      @media (forced-colors: active) {
        .b-sep {
          color: CanvasText;
        }
      }
    </style>

  <body>
    <!-- A real <nav> around a real <ul>. The list items used to sit straight
         inside a <div>, which no parser accepts. -->
    <nav class="b-nav" id="b-nav" aria-label="Main">
      <ul>
        <li>
          <a class="b-link b-link--active" href="#" aria-current="page">Home</a>
        </li>
        <li><a class="b-link" href="#">About</a></li>
        <li><a class="b-link" href="#">Portfolio</a></li>
        <li><a class="b-link" href="#">Contact</a></li>
      </ul>
    </nav>

    <div class="b-container">
      <!-- A <button>, not a <div>. This is what makes the menu reachable by
           keyboard and announced as an expandable control. -->
      <button
        class="b-menu"
        type="button"
        aria-expanded="false"
        aria-controls="b-nav"
        aria-label="Open menu"
      >
        <span class="b-bun b-bun--top"></span>
        <span class="b-bun b-bun--mid"></span>
        <span class="b-bun b-bun--bottom"></span>
      </button>

      <!-- Burger-Brand -->
      <h1 class="b-heading"><a href="#" class="b-brand">Burger</a></h1>
    </div>

    <!-- The demo is the menu. Everything the prose here used to explain is in
         the README, which is where someone deciding whether to install it is
         reading anyway. -->
    <main class="b-content">
      <nav class="b-trail" aria-label="Breadcrumb">
        <ol>
          <li>
            <!-- rel="author" marks the identity edge, matching the footer
                 credit. Only this crumb carries it; /projects is a collection. -->
            <a href="https://blode.co" rel="author">Matthew Blode</a>
          </li>
          <li class="b-sep" aria-hidden="true">&rsaquo;</li>
          <li><a href="https://blode.co/projects">Projects</a></li>
          <li class="b-sep" aria-hidden="true">&rsaquo;</li>
          <!-- The current page is not a link, and says so. -->
          <li aria-current="page">Burger</li>
        </ol>
      </nav>

      <p>
        A minimal hamburger menu with fullscreen navigation. One stylesheet, one
        ES module, no dependencies.
      </p>
    </main>

    <!--
      blode.co and blode.co/projects are this same origin behind a rewrite, so
      both are internal links: same tab, and no rel="noopener noreferrer", which
      only means something cross-origin. This zone had no link home at all: only
      a canonical tag, so a reader who landed here had no way back and a crawler
      had no path out. See
      blode-co/apps/web/.claude/knowledge/zone-conventions.md.
    -->
    <footer class="b-footer">
      <p class="b-credit">
        Crafted by
        <a class="b-author" href="https://blode.co" rel="author">
          <!-- Decorative: the link text names them, so alt text here would only
               make a screen reader say "Matthew Blode" twice. -->
          <img
            alt=""
            class="b-avatar"
            height="20"
            src="img/avatar-sm.png"
            width="20"
          />
          Matthew Blode
        </a>
      </p>
      <p class="b-elsewhere">
        <a href="https://blode.co/projects">All projects</a>
        <span class="b-sep" aria-hidden="true">&middot;</span>
        <a
          href="https://github.com/mblode/burger"
          rel="noopener noreferrer"
          target="_blank"
          >GitHub</a
        >
        <span class="b-sep" aria-hidden="true">&middot;</span>
        <a
          href="https://www.npmjs.com/package/the-burger"
          rel="noopener noreferrer"
          target="_blank"
          >npm</a
        >
      </p>
    </footer>

    <script type="module" src="scripts/burger.min.js"></script>
  </body>
</html>
