name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install
        run: npm ci

      - name: Changeset Status
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/master'
        run: npx changeset status --since origin/master

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Typecheck
        run: npm run check:types

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Publint
        run: npx publint

      - name: Check exports
        run: npm run check:exports

      # dist/ is committed and consumed by CDN users, so a build that produces
      # different output than what was pushed means someone edited src/ without
      # rebuilding. Fail here rather than ship a stale bundle.
      #
      # Maps are excluded: Lightning CSS resolves @imports concurrently, so the
      # `sources` order in burger.min.css.map varies between runs even though the
      # CSS itself is byte-identical. Gating on it would fail at random.
      - name: Verify dist is up to date
        run: git diff --exit-code -- dist ':(exclude)dist/**/*.map'
